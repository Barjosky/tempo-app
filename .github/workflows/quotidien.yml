# Remplace le PC allume : c'est GitHub qui collecte et predit chaque jour.
# La base SQLite et le modele vivent dans le cache Actions (trop volumineux pour git) ;
# seuls les JSON du site sont commites, ce qui declenche la republication par Pages.
name: Prevision quotidienne

on:
  schedule:
    # 6h30 UTC = 8h30 a Paris l'ete. Demander SI TOT est contre-intuitif -- l'annonce
    # RTE n'a pas encore eu lieu -- mais c'est justement le retard de GitHub qu'on
    # exploite : mesure a 2 h 30 / 4 h, ce passage s'executera entre 11h et 12h30,
    # apres l'annonce. On demande tot pour etre servi a l'heure.
    # Le pari peut rater dans les deux sens : si GitHub redevient ponctuel, ce passage
    # tourne avant l'annonce et le J+1 sort en prediction au lieu de la couleur
    # officielle. D'ou le cron suivant, conserve comme filet.
    - cron: "30 6 * * *"
    # 10h30 UTC = apres l'annonce RTE de 11h (Paris) toute l'annee : 11h30 l'hiver,
    # 12h30 l'ete. Le filet, celui qui ne depend d'aucun pari.
    - cron: "30 10 * * *"
    # Deuxieme passage en fin de journee, pour rattraper une prevision meteo qui a
    # bouge depuis le matin. 19h l'ete, 18h l'hiver -- un cron ne connait que l'UTC et
    # ne suit pas le changement d'heure.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      reentrainer:
        description: "Reentrainer le modele (a faire apres tout changement de features)"
        type: boolean
        default: false
      rejouer:
        description: "Rejouer le backtest dans l'historique de la page (long)"
        type: boolean
        default: false
      diagnostic:
        description: "Mesurer l'apport de chaque feature (tres long)"
        type: boolean
        default: false
      selection:
        description: "Comparer les configurations de modele (tres long)"
        type: boolean
        default: false
      saisons:
        description: "Profiler les saisons : pourquoi certains hivers sont durs"
        type: boolean
        default: false
      seuils:
        description: "Recaler les seuils d'alerte, en rappel/precision puis en euros (long)"
        type: boolean
        default: false
      rte:
        description: "Mesurer la prevision RTE a J+1 seulement, la ou elle existe (long)"
        type: boolean
        default: false
      sonde_rte:
        description: "Sonder l'API RTE des indisponibilites : est-elle exploitable ?"
        type: boolean
        default: false
      rte_complet:
        description: "Rebalayer tout l'historique des indisponibilites RTE (long)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prevision-quotidienne
  cancel-in-progress: false

jobs:
  prevoir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Les tests hors base tournent partout ; ceux qui exigent les vraies donnees
      # se sautent tant que le cache n'a rien restaure.
      - name: Tests
        run: python run_tests.py

      # Cle glissante : chaque execution ecrit un nouveau cache, restore-keys
      # recupere le plus recent (une cle Actions ne peut pas etre ecrasee).
      - name: Restaurer la base et le modele
        uses: actions/cache/restore@v4
        with:
          path: store
          key: tempo-store-${{ github.run_id }}
          restore-keys: tempo-store-

      - name: Constituer l'historique si le cache est vide
        run: |
          if [ ! -f store/tempo.db ]; then
            echo "Aucun cache : collecte complete de l'historique (~40 min)"
            python ingest.py
            python ingest_renouvelables.py
            python ingest_conso.py
            python collector.py --train
            python backfill.py
          fi

      # AVANT la collecte : `collector.py` reentraine de lui-meme quand le modele en
      # cache est obsolete, et il le ferait sur une base ou `nucleaire_mw` est encore
      # vide -- les predictions du jour sortiraient d'un modele sans donnees d'offre.
      - name: Recollecter la consommation (colonnes ajoutees depuis)
        if: inputs.reentrainer == true
        run: python ingest_conso.py

      # Apres la constitution de l'historique, jamais avant : ce script cree
      # store/tempo.db, et le faire tourner en amont ferait croire a l'etape
      # precedente que le cache est plein et lui ferait sauter toute la collecte.
      # Sans secret RTE il sort en silence et les colonnes d'offre restent a NaN.
      - name: Collecter les indisponibilites de production (RTE)
        env:
          RTE_BASIC_AUTH: ${{ secrets.RTE_BASIC_AUTH }}
          RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
          RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
        run: |
          if [ "${{ inputs.rte_complet }}" = "true" ]; then
            python ingest_rte.py --complet
          else
            python ingest_rte.py
          fi

      - name: Collecte du jour et prediction
        run: python collector.py

      # Un changement de features rend le modele en cache obsolete : ses colonnes ne
      # correspondent plus. D'ou le declenchement manuel, en plus du lundi.
      # Le lundi, le reentrainement suit un SEUL passage, celui de 10h30 : la condition
      # etait « tout sauf le soir », ce qui en aurait declenche deux depuis l'ajout du
      # passage de 6h30 -- cinq minutes de calcul pour le meme modele.
      - name: Reentrainer le modele
        env:
          PASSAGE_DU_MATIN: ${{ github.event.schedule == '30 10 * * *' }}
        run: |
          if [ "${{ inputs.reentrainer }}" = "true" ] ||
             { [ "$(date +%u)" = "1" ] && [ "$PASSAGE_DU_MATIN" = "true" ]; }; then
            python collector.py --train
          fi

      - name: Rejouer le backtest dans l'historique
        if: inputs.rejouer == true
        run: python backfill.py

      # Purement informatif : le resultat se lit dans les logs, rien n'est publie.
      - name: Mesurer l'apport de chaque feature
        if: inputs.diagnostic == true
        run: python diagnostic_features.py --reps 5

      # Purement informatif lui aussi : la conclusion se lit dans les logs et se
      # reporte a la main dans config.py, plutot que de laisser un script decider
      # seul d'un reglage sur quatre saisons.
      - name: Profiler les saisons
        if: inputs.saisons == true
        run: python diagnostic_saison.py

      - name: Comparer les configurations de modele
        if: inputs.selection == true
        run: python selection_modele.py

      # La prevision de RTE n'existe qu'a J+1. Permuter sa colonne sur les dix
      # echeances ne touche qu'un dixieme des lignes : elle sortait en poids mort
      # sans qu'on sache si c'etait sa valeur ou sa rarete qu'on mesurait.
      - name: Mesurer la prevision RTE a son echeance
        if: inputs.rte == true
        run: python diagnostic_features.py --horizon 1 --reps 8

      # Le seuil d'alerte n'a pas ete recale depuis la contrainte de quota, qui a
      # change les probabilites de fin d'hiver. Le cache se perime tout seul quand la
      # configuration bouge, donc `--refit` n'a pas a etre demande de memoire.
      # A lancer AVANT de batir quoi que ce soit sur cette API : si son historique ne
      # remonte pas assez loin, la colonne serait vide sur toutes les saisons
      # d'entrainement et le backtest ne pourrait rien mesurer.
      - name: Sonder l'API RTE des indisponibilites
        if: inputs.sonde_rte == true
        env:
          RTE_BASIC_AUTH: ${{ secrets.RTE_BASIC_AUTH }}
          RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
          RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
        run: python sonde_rte.py

      - name: Recaler les seuils d'alerte
        if: inputs.seuils == true
        run: |
          python analyse_seuils.py
          python analyse_euros.py

      - name: Figer les donnees du site
        run: python export_static.py

      - name: Sauvegarder la base et le modele
        uses: actions/cache/save@v4
        if: always()
        with:
          path: store
          key: tempo-store-${{ github.run_id }}

      - name: Publier (GitHub Pages republie sur ce commit)
        run: |
          git config user.name "tempo-bot"
          git config user.email "tempo-bot@users.noreply.github.com"
          # index.html porte l'empreinte des assets : sans lui, un navigateur peut
          # servir la nouvelle page avec l'ancien script, en silence.
          git add data index.html
          if git diff --staged --quiet; then
            echo "Aucun changement a publier"
          else
            git commit -m "Previsions du $(date -u +%Y-%m-%d)"
            # Le job dure jusqu'a une heure ; la branche peut avoir avance entre le
            # checkout et ici. Un push direct est alors rejete et TOUT le travail est
            # perdu -- c'est arrive deux fois. Le commit ne touchant que des fichiers
            # generes, le rebaser sur l'etat courant est sans risque.
            for essai in 1 2 3; do
              git push && exit 0
              echo "Push rejete (essai $essai) : la branche a avance, on rebase."
              git pull --rebase origin "${GITHUB_REF_NAME}" || exit 1
            done
            echo "::error::Publication impossible apres trois tentatives"
            exit 1
          fi
